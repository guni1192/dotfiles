---
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
# CLI tools for this dotfiles. Install with `./scripts/init.sh setup-all`.
# checksum.supported_envs limits which platforms `aqua update-checksum` records.
# darwin/arm64 is the work Mac. linux covers Ubuntu. Windows is not precomputed.
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - darwin/arm64
    - darwin/amd64
    - linux/amd64
    - linux/arm64
registries:
- type: standard
  ref: v4.575.0 # renovate: depName=aquaproj/aqua-registry
packages:
- name: neovim/neovim@v0.12.6
- name: junegunn/fzf@v0.74.5
- name: x-motemen/ghq@v1.11.2
- name: cli/cli@v2.103.1
- name: BurntSushi/ripgrep@15.2.0
- name: kubernetes/kubernetes/kubectl@v1.37.1
- name: nodejs/node@v26.12.1
- name: tree-sitter/tree-sitter@v0.27.1
- name: hashicorp/terraform-ls@v0.39.0
- name: LuaLS/lua-language-server@3.19.2
- name: rust-lang/rust-analyzer@2026-10-19
- name: mikefarah/yq@v4.54.1
- name: gitleaks/gitleaks@v8.30.1
- name: herdrdev/herdr@v0.9.5
# claude-code is not in this list. Auto-update follows autoUpdatesChannel in
# claude/settings.json, so `aqua install -a` must not reinstall a pinned binary.
# scripts/init.sh installs it once from claude.yaml when `claude` is missing.
- name: pnpm/pnpm@v12.15.0
# go before gopls: gopls is type go_install and needs a Go toolchain.
# Stay on the 1.26 line. 1.27 is not applied here.
- name: golang/go@go1.27.3
- name: golang.org/x/tools/gopls@v0.24.0
# Scripts call jq. Registry: pkgs/jqlang/jq (version_prefix jq-).
- name: jqlang/jq@jq-1.8.2
# Replaces the rustup curl|sh installer. Registry: pkgs/rust-lang/rustup.
- name: rust-lang/rustup@1.29.2
