# Herdr — terminal workspace manager for AI coding agents
# https://herdr.dev/docs/configuration/
#
# Only this file is managed by dotfiles. Do not symlink ~/.config/herdr/ —
# Herdr also stores logs, sockets, and session.json there.

onboarding = false

# ============================================================================
# Color palette
#   Ghostty Nocturnal Winter (ghostty/config) — surfaces + semantic
#     bg       #0d0d17
#     fg       #e6e5e5
#     red      #f12d52
#     green    #09cd7e
#     yellow   #f5f17a
#     magenta  #ff2b6d
#     muted    #808080
#   zsh/prompt.zsh + tmux.conf — blue / cyan chrome
#     navy     24  #005f87
#     sky      39  #00afff
#     aqua     45  #00d7ff
#     cyan     51  #00ffff
#     ice      123 #87ffff
#     bg_deep  17  #00005f
# ============================================================================

[theme]
# Inherit Ghostty's default bg/fg. Ghostty's ANSI cyan (palette 6) is green
# (#09c87a), so chrome accents are the prompt's cyan gradient instead.
name = "terminal"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
text = "#e6e5e5"
subtext0 = "#808080"
surface0 = "#161628"
surface1 = "#1e1e36"
surface_dim = "#12121f"
overlay0 = "#4d4d4d"
overlay1 = "#808080"

accent = "#00ffff"
blue = "#00afff"
teal = "#00d7ff"
mauve = "#00d7ff"
active_row_bg = "#005f87"
selection_bg = "#00005f"

red = "#f12d52"
green = "#09cd7e"
yellow = "#f5f17a"
peach = "#ff2b6d"

[terminal]
# Match tmux `default-command "${SHELL}"`: avoid macOS login-shell path_helper.
shell_mode = "non_login"
# New panes / tabs inherit the source pane cwd (tmux `split-window -c`).
new_cwd = "follow"

[keys]
# Same prefix as tmux/tmux.conf (`set -g prefix C-j`).
prefix = "ctrl+j"

# Split right / down — tmux `bind |` / `bind -`.
#   right: herdr default is prefix+v (unused by tmux). `|` is free in herdr, so
#          keep v and add `|` rather than unbinding the original.
#   down:  herdr default is already prefix+minus; same as tmux.
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = "prefix+minus"

# ============================================================================
# AI helpers (tmux prefix+C / prefix+A)
#   type = "pane"  — temporary zoomed pane; closes when the command exits
#   type = "popup" — session-modal overlay; does not change the tab layout
# ============================================================================

[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "claude"
description = "claude (zoomed pane)"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "claude"
description = "claude beside work"
width = "40%"
height = "100%"

[ui]
mouse_capture = true
copy_on_select = true
pane_borders = true
# tmux-style internal splitters, no outer frame.
pane_outer_borders = false
# tmux status-position bottom.
tab_bar_position = "bottom"
# tmux `bind c` creates a window immediately.
prompt_new_tab_name = false
accent = "cyan"
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[session]
resume_agents_on_restore = true

[experimental]
# Japanese IME: switch to ASCII while prefix commands are active (macOS / Windows).
switch_ascii_input_source_in_prefix = true
# Keep the IME candidate window tracking agent TUIs that hide the hardware cursor.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "cursor", "copilot"]
