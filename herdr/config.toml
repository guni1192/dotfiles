# Herdr — terminal workspace manager for AI coding agents
# https://herdr.dev/docs/configuration/
#
# Only this file is managed by dotfiles. Do not symlink ~/.config/herdr/ —
# Herdr also stores logs, sockets, and session.json there.

onboarding = false

# ============================================================================
# Color palette — shared with tmux.conf / zsh/prompt.zsh (blue / cyan)
#   bg_base  #1c1c1c
#   navy     #005f87
#   sky      #00afff
#   aqua     #00d7ff
#   cyan     #00ffff
#   ice      #87ffff
#   muted    #808080
#   fg       #eeeeee
# ============================================================================

[theme]
# Follow Ghostty's palette; override accent to match tmux / prompt.
name = "terminal"

[theme.custom]
sidebar_bg = "#1c1c1c"
active_row_bg = "#005f87"
selection_bg = "#00005f"
accent = "#00ffff"
blue = "#00afff"
green = "#00d7ff"
yellow = "#87ffff"

[terminal]
# Match tmux `default-command "${SHELL}"`: avoid macOS login-shell path_helper.
shell_mode = "non_login"
# New panes / tabs inherit the source pane cwd (tmux `split-window -c`).
new_cwd = "follow"

[keys]
# Same prefix as tmux/tmux.conf (`set -g prefix C-j`).
prefix = "ctrl+j"

# ---------------------------------------------------------------------------
# tmux-aligned bindings (unlisted keys keep Herdr defaults)
#   prefix+h/j/k/l  focus pane
#   prefix+c        new tab
#   prefix+x        close pane
#   prefix+z        zoom
#   prefix+[        copy mode
#   prefix+w        workspace picker
#   prefix+g        goto
#   prefix+1..9     switch tab
# ---------------------------------------------------------------------------

# Splits — tmux `bind |` / `bind -` (keep Herdr's prefix+v / prefix+minus too).
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = "prefix+minus"

# Windows → tabs — tmux `bind -r C-h` / `C-l`.
previous_tab = ["prefix+p", "prefix+ctrl+h"]
next_tab = ["prefix+n", "prefix+ctrl+l"]

# Reload — tmux `bind C-r`. Keep Herdr's prefix+shift+r as well.
reload_config = ["prefix+shift+r", "prefix+ctrl+r"]

# Rename tab — Herdr default. tmux uses prefix+R, but that chord is
# prefix+shift+r here and is already bound to reload_config.
rename_tab = "prefix+shift+t"

# ============================================================================
# AI helpers (tmux prefix+C / prefix+A)
#   type = "pane"  — temporary zoomed pane; closes when the command exits
#   type = "popup" — session-modal overlay; does not change the tab layout
# ============================================================================

[[keys.command]]
key = "prefix+shift+c"
type = "pane"
command = "claude"
description = "claude (zoomed pane)"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "claude"
description = "claude beside work"
width = "40%"
height = "100%"

[ui]
mouse_capture = true
copy_on_select = true
pane_borders = true
# tmux-style internal splitters, no outer frame.
pane_outer_borders = false
# tmux status-position bottom.
tab_bar_position = "bottom"
# tmux `bind c` creates a window immediately.
prompt_new_tab_name = false
accent = "cyan"
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[session]
resume_agents_on_restore = true

[experimental]
# Japanese IME: switch to ASCII while prefix commands are active (macOS / Windows).
switch_ascii_input_source_in_prefix = true
# Keep the IME candidate window tracking agent TUIs that hide the hardware cursor.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "cursor", "copilot"]
